appId: com.tikoeats.print
# No accents in the app/executable name: Electron crashes at launch on macOS
# when its own path has non-ASCII characters ("Tiko Impresión.app"). What
# people see — window title, tray, shortcuts, installer title — keeps the tilde.
productName: Tiko Impresion
copyright: Copyright © Intelligsofts Systems SRL
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - build/icon.png
artifactName: Tiko-Impresion-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: Tiko Impresión
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.business
  icon: build/icon.png
dmg:
  title: Tiko Impresión
